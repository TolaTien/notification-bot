name: News Monitor Bot

on:
  schedule:
    # Tự động quét mỗi 5 phút 24/7
    - cron: "*/5 * * * *"
  # Cho phép bấm nút "Run workflow" thủ công trên GitHub để test ngay
  workflow_dispatch:
    inputs:
      test_email:
        description: "Gửi email kiểm tra cấu hình SMTP (true/false)"
        required: false
        default: "false"
      since_days:
        description: "Gửi các tin chưa đọc trong N ngày gần đây (để 0 nếu chạy bình thường)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: news-monitor-bot
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run News Monitor Bot
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          SENDER_NAME: ${{ secrets.SENDER_NAME || 'News Monitor Bot' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
        run: |
          if [ "${{ github.event.inputs.test_email }}" = "true" ]; then
            python main.py --test-email
          elif [ -n "${{ github.event.inputs.since_days }}" ] && [ "${{ github.event.inputs.since_days }}" != "0" ]; then
            python main.py --since-days "${{ github.event.inputs.since_days }}"
          else
            python main.py
          fi

      - name: Commit updated state (only when new articles were found)
        run: |
          if ! git diff --quiet state/seen.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/seen.json
            git commit -m "chore(state): update seen articles [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "${{ github.ref_name }}"
          else
            echo "No state changes to commit."
          fi
