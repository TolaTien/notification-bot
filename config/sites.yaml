# Danh sách các trang web cần theo dõi tin tức / thông báo
# Bot hỗ trợ 4 kiểu quét:
#   - wp_api : Web chạy WordPress (lấy thẳng JSON từ /wp-json/wp/v2/posts, rất nhanh & ổn định)
#   - html   : Quét HTML bằng CSS selector
#   - rss    : Đọc RSS / Atom feed
#   - auto   : Tự động nhận diện (RSS -> WordPress API -> HTML) — tiện nhất khi thêm web mới!
#
# Lưu ý chống trùng:
#   Các nguồn đặt phía trên có độ ưu tiên gắn nhãn cao hơn nếu cùng 1 bài xuất hiện ở nhiều mục.

sources:
  # ==========================================================
  # 1. IIG VIỆT NAM (https://iigvietnam.com/vi)
  # ==========================================================
  - id: iig-thong-bao
    name: "IIG Việt Nam - Quy định & Thông báo"
    url: "https://iigvietnam.com/vi/tin-tuc/chuyen-muc/quy-dinh-va-thong-bao"
    type: html
    enabled: true
    limit: 15
    color: "#D97706"
    item_selector: "article.cd-featured-slide, article.cd-card"
    link_selector: "h2 a, h3 a, a.cd-card-link"
    date_selector: "time"
    summary_selector: "p.cd-featured-excerpt, p.cd-card-text"
    content_selector: ".cd-detail"
    include_patterns:
      - "/vi/tin-tuc/"
    exclude_patterns:
      - "/chuyen-muc/"

  - id: iig-tin-tuc
    name: "IIG Việt Nam - Tin tức"
    url: "https://iigvietnam.com/vi/tin-tuc"
    type: html
    enabled: true
    limit: 15
    color: "#2563EB"
    # Lọc AI thông minh: tự ẩn bài PR/sự kiện mức "Tham khảo", chỉ gửi bài mức "Trung bình" hoặc "Cao"
    min_importance: "Trung bình"
    item_selector: "article.cd-featured-slide, article.cd-card"
    link_selector: "h2 a, h3 a, a.cd-card-link"
    date_selector: "time"
    summary_selector: "p.cd-featured-excerpt, p.cd-card-text"
    content_selector: ".cd-detail"
    include_patterns:
      - "/vi/tin-tuc/"
    exclude_patterns:
      - "/chuyen-muc/"

  # ==========================================================
  # 2. HỌC VIỆN CÔNG NGHỆ BƯU CHÍNH VIỄN THÔNG (PTIT)
  # ==========================================================
  - id: ptit-giaovu
    name: "PTIT - Phòng Giáo vụ (Lịch học, ĐK tín chỉ, Học phí)"
    url: "https://giaovu.ptit.edu.vn"
    type: wp_api
    enabled: true
    limit: 15
    color: "#DC2626"
    content_selector: ".post-content"

  - id: ptit-daotao
    name: "PTIT - Đào tạo (Lịch thi TOEIC, Tiếng Anh, Văn bằng)"
    url: "https://daotao.ptit.edu.vn"
    type: wp_api
    enabled: true
    limit: 15
    color: "#EA580C"
    content_selector: ".post-content"

  - id: ptit-thong-bao
    name: "PTIT - Thông báo chung (Trang chủ)"
    url: "https://ptit.edu.vn"
    type: wp_api
    enabled: true
    limit: 15
    color: "#B91C1C"
    content_selector: ".post-content"
    # Các chuyên mục thông báo trên ptit.edu.vn:
    #   176: Thông báo | 172: Thông báo sinh viên | 239: Thông báo tốt nghiệp văn bằng
    #   199: Thông báo học bổng | 344: Giáo vụ
    categories: [176, 172, 239, 199, 344]

  - id: ptit-tin-tuc
    name: "PTIT - Tin tức (Trang chủ)"
    url: "https://ptit.edu.vn"
    type: wp_api
    enabled: true
    limit: 15
    color: "#991B1B"
    content_selector: ".post-content"
    # Lọc AI thông minh: tự ẩn bài lễ kỷ niệm/PR mức "Tham khảo", vẫn bắt được nếu có thông báo quan trọng đăng nhầm mục
    min_importance: "Trung bình"
    # Không lọc categories => quét toàn bộ bài viết mới trên ptit.edu.vn
    # (Bài nào đã nằm ở ptit-thong-bao sẽ tự động chống trùng, không gửi 2 lần)

  # (Tuỳ chọn) Bật enabled: true nếu bạn muốn theo dõi thêm Cổng Tuyển sinh PTIT:
  - id: ptit-tuyensinh
    name: "PTIT - Tuyển sinh"
    url: "https://tuyensinh.ptit.edu.vn"
    type: wp_api
    enabled: false
    limit: 10
    color: "#7C3AED"
    content_selector: ".post-content"

  # ==========================================================
  # MẪU THÊM WEB MỚI SAU NÀY (bỏ dấu # để kích hoạt)
  # ==========================================================
  # - id: web-moi-auto
  #   name: "Tên trang web mới"
  #   url: "https://example.com/thong-bao"
